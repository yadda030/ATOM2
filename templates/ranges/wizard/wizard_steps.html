<div class="wizard-steps">
    <div class="wizard-step">
        <div class="step-circle {% if step > 1 %}done{% elif step == 1 %}active{% else %}pending{% endif %}">
            {% if step > 1 %}✓{% else %}1{% endif %}
        </div>
        <span class="step-label {% if step > 1 %}done{% elif step == 1 %}active{% else %}pending{% endif %}">Info</span>
    </div>
    <div class="step-connector {% if step > 1 %}done{% endif %}"></div>
    <div class="wizard-step">
        <div class="step-circle {% if step > 2 %}done{% elif step == 2 %}active{% else %}pending{% endif %}">
            {% if step > 2 %}✓{% else %}2{% endif %}
        </div>
        <span class="step-label {% if step > 2 %}done{% elif step == 2 %}active{% else %}pending{% endif %}">Networks</span>
    </div>
    <div class="step-connector {% if step > 2 %}done{% endif %}"></div>
    <div class="wizard-step">
        <div class="step-circle {% if step > 3 %}done{% elif step == 3 %}active{% else %}pending{% endif %}">
            {% if step > 3 %}✓{% else %}3{% endif %}
        </div>
        <span class="step-label {% if step > 3 %}done{% elif step == 3 %}active{% else %}pending{% endif %}">Virtual machines</span>
    </div>
    <div class="step-connector {% if step > 3 %}done{% endif %}"></div>
    <div class="wizard-step">
        <div class="step-circle {% if step == 4 %}active{% else %}pending{% endif %}">4</div>
        <span class="step-label {% if step == 4 %}active{% else %}pending{% endif %}">Review</span>
    </div>
</div>
